name: Apply direct DM and UI cleanup

on:
  push:
    branches:
      - feature/direct-dm-clean-ui
    paths:
      - .github/workflows/apply-direct-dm-clean-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/direct-dm-clean-ui
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply changes
        run: python3 .github/scripts/apply_direct_dm_clean_ui.py

      - name: Validate changes
        run: |
          git diff --check
          npm test

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/LocalGroupArchive/index.ts plugin/LocalGroupArchive/README.md README.md CHANGELOG.md package.json
          git commit -m "Add Direct Message archiving and standardize UI"
          git push origin HEAD:feature/direct-dm-clean-ui
