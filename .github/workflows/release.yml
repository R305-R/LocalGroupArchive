name: Release installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    uses: ./.github/workflows/ci.yml

  installer:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end installer engine test
        shell: powershell
        run: |
          $result = Join-Path $env:RUNNER_TEMP "LocalGroupArchive-install-result.txt"
          & .\installer\Install-LocalGroupArchive.ps1 -Action Install -PayloadRoot .\plugin -Repository $env:GITHUB_REPOSITORY -SkipInject -ResultFile $result
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path -LiteralPath $result) { Get-Content -LiteralPath $result }
            throw "Installer engine failed with exit code $LASTEXITCODE"
          }
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF -like "refs/tags/*" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
          "LGA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LGA_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer and portable source package
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DRepository=$env:GITHUB_REPOSITORY" "/DAppVersion=$env:LGA_VERSION" "installer\LocalGroupArchive.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path plugin,installer,tests,.github,package.json,README.md,CHANGELOG.md,SECURITY.md,LICENSE -DestinationPath "dist\LocalGroupArchive-v$env:LGA_VERSION-source.zip" -Force
          $exe = Get-ChildItem dist\LocalGroupArchive-Setup*.exe | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -LiteralPath "dist\$($exe.Name).sha256" -Encoding ascii
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName }
          gh release view "$env:LGA_RELEASE_TAG" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:LGA_RELEASE_TAG" @assets --clobber
            gh release edit "$env:LGA_RELEASE_TAG" --title "LocalGroupArchive $env:LGA_RELEASE_TAG"
          } else {
            gh release create "$env:LGA_RELEASE_TAG" @assets --target "$env:GITHUB_SHA" --generate-notes --title "LocalGroupArchive $env:LGA_RELEASE_TAG"
          }
